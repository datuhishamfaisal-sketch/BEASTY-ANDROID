
plugins {
    id 'com.android.application'
}

def geminiKey = System.getenv("GEMINI_API_KEY") ?: ""
def groqKey = System.getenv("GROQ_API_KEY") ?: ""

android {
    namespace 'com.beasty.assistant'
    compileSdk 36

    defaultConfig {
        applicationId 'com.beasty.assistant'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
        buildConfigField "String", "GROQ_API_KEY", "\"${groqKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
