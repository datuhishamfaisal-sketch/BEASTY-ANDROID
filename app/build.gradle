plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def geminiKey = System.getenv("GEMINI_API_KEY") ?: ""
def groqKey = System.getenv("GROQ_API_KEY") ?: ""
def openAiKey = System.getenv("OPENAI_API_KEY") ?: ""

android {
    namespace 'com.beasty.assistant'
    compileSdk 36
    defaultConfig {
        applicationId 'com.beasty.assistant'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.2-openwakeword"
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
        buildConfigField "String", "GROQ_API_KEY", "\"${groqKey}\""
        buildConfigField "String", "OPENAI_API_KEY", "\"${openAiKey}\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
}
