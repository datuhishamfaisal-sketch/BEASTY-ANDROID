name: BEASTY Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/openwakeword-android

concurrency:
  group: beasty-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BEASTY
        uses: actions/checkout@v4

      - name: Download pinned Hey Jarvis ONNX models
        run: |
          set -e
          MODEL_DIR="app/src/main/assets/openwakeword"
          mkdir -p "$MODEL_DIR"
          BASE="https://raw.githubusercontent.com/msnilsen/openwakeword-android/b49f3ab14cf558ac0c2aef73a5e6c83da7a08558/openwakeword/src/main/assets/openwakeword"
          for MODEL in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl --fail --location --retry 3 "$BASE/$MODEL" -o "$MODEL_DIR/$MODEL"
            test -s "$MODEL_DIR/$MODEL"
          done
          ls -lh "$MODEL_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle for BEASTY
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip

      - name: Verify AI API secrets are configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing or empty"; exit 1; }
          test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY is missing or empty"; exit 1; }
          echo "Both AI API secrets are present (values hidden)."

      - name: Build BEASTY debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ./gradle-8.11.1/bin/gradle :app:assembleDebug --no-daemon

      - name: Upload BEASTY APK
        uses: actions/upload-artifact@v4
        with:
          name: BEASTY-openwakeword-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
