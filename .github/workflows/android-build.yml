name: BEASTY Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sherpa-onnx-wakeword

concurrency:
  group: beasty-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BEASTY
        uses: actions/checkout@v4

      - name: Checkout official sherpa-onnx source
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: v2.0.1
          path: sherpa-onnx

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Android native libraries
        working-directory: sherpa-onnx
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2
          tar -xjf sherpa-onnx-v2.0.1-android.tar.bz2
          mkdir -p android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs
          cp -R jniLibs/* android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs/

      - name: Build official sherpa-onnx AAR
        working-directory: sherpa-onnx/android/SherpaOnnxAar
        run: |
          chmod +x ./gradlew
          ./gradlew :sherpa_onnx:assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp sherpa_onnx/build/outputs/aar/sherpa_onnx-release.aar "$GITHUB_WORKSPACE/app/libs/sherpa-onnx-2.0.1.aar"

      - name: Prepare offline Hey BEASTY keyword model
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          tar -xjf sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          MODEL_DIR=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          ASSET_DIR=app/src/main/assets/$MODEL_DIR
          mkdir -p "$ASSET_DIR"
          cp "$MODEL_DIR"/encoder-epoch-12-avg-2-chunk-16-left-64.onnx "$ASSET_DIR"/
          cp "$MODEL_DIR"/decoder-epoch-12-avg-2-chunk-16-left-64.onnx "$ASSET_DIR"/
          cp "$MODEL_DIR"/joiner-epoch-12-avg-2-chunk-16-left-64.onnx "$ASSET_DIR"/
          cp "$MODEL_DIR"/tokens.txt "$ASSET_DIR"/
          cp "$MODEL_DIR"/bpe.model "$ASSET_DIR"/
          python3 -m pip install --quiet sentencepiece
          python3 - <<'PY'
          import sentencepiece as spm
          model = spm.SentencePieceProcessor(model_file="sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/bpe.model")
          pieces = model.encode("HEY BEASTY", out_type=str)
          with open("app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/keywords.txt", "w", encoding="utf-8") as f:
              f.write(" ".join(pieces) + " @HEY BEASTY\n")
          print("Generated Hey BEASTY keyword tokens:", pieces)
          PY

      - name: Set up Gradle for BEASTY
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip

      - name: Build BEASTY debug APK
        run: |
          ./gradle-8.11.1/bin/gradle :app:assembleDebug --no-daemon

      - name: Upload BEASTY APK
        uses: actions/upload-artifact@v4
        with:
          name: BEASTY-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
